---
# Minimal Roblox globals for selene. The official "roblox" std is generated from the Roblox API
# dump (`selene generate-roblox-std`), which needs a direct download; the cloud proxy blocks it.
# On a normal PC run `selene generate-roblox-std`, set `std = "roblox"` in selene.toml and delete
# this file. Add new globals here when new code needs them.
base: luau
globals:
  game:
    any: true
  workspace:
    any: true
  script:
    any: true
  plugin:
    any: true
  shared:
    any: true
  Enum:
    any: true
  Instance:
    any: true
  Color3:
    any: true
  ColorSequence:
    any: true
  ColorSequenceKeypoint:
    any: true
  NumberSequence:
    any: true
  NumberSequenceKeypoint:
    any: true
  NumberRange:
    any: true
  CFrame:
    any: true
  Vector2:
    any: true
  Vector3:
    any: true
  UDim:
    any: true
  UDim2:
    any: true
  Rect:
    any: true
  Region3:
    any: true
  Ray:
    any: true
  TweenInfo:
    any: true
  BrickColor:
    any: true
  Random:
    any: true
  PhysicalProperties:
    any: true
  Font:
    any: true
  OverlapParams:
    any: true
  RaycastParams:
    any: true
  DateTime:
    any: true
  Axes:
    any: true
  Faces:
    any: true
  task:
    any: true
  typeof:
    any: true
  wait:
    any: true
  delay:
    any: true
  spawn:
    any: true
  tick:
    any: true
  time:
    any: true
  warn:
    any: true
  settings:
    any: true
  UserSettings:
    any: true
  elapsedTime:
    any: true
